name: Nekbaar CI & Manual Supabase RLS Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nekbaar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-checks:
    name: Automated Checks (Tests, TypeScript & Build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit & Security Contract Tests
        run: npm test

      - name: TypeScript Verification
        run: npm run lint

      - name: Production Build Verification
        run: npm run build

  rls-integration:
    name: Primary Supabase RLS Integration Verification (Manual Only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: ci-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Primary Supabase Project Credentials (qbwnzunusmaidciakuod)
        env:
          TEST_SUPABASE_URL: https://qbwnzunusmaidciakuod.supabase.co
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
            const expectedRef = "qbwnzunusmaidciakuod";
            const expectedUrl = `https://${expectedRef}.supabase.co`;
            const url = (process.env.TEST_SUPABASE_URL || "").trim().replace(/\/+$/, "");
            if (url !== expectedUrl) {
              console.error(`Expected TEST_SUPABASE_URL=${expectedUrl}, got ${url || "<empty>"}`);
              process.exit(1);
            }
            const decodeRef = (jwt, label, expectedRole) => {
              if (!jwt || jwt.split(".").length !== 3) {
                console.error(`${label} is missing or not a 3-part JWT.`);
                process.exit(1);
              }
              const payload = JSON.parse(Buffer.from(jwt.split(".")[1], "base64url").toString("utf8"));
              if (payload.ref !== expectedRef) {
                console.error(`${label} belongs to project "${payload.ref || "unknown"}", expected "${expectedRef}".`);
                process.exit(1);
              }
              if (payload.role !== expectedRole) {
                console.error(`${label} has role "${payload.role || "unknown"}", expected "${expectedRole}".`);
                process.exit(1);
              }
            };
            decodeRef((process.env.TEST_SUPABASE_ANON_KEY || "").trim(), "TEST_SUPABASE_ANON_KEY", "anon");
            decodeRef((process.env.TEST_SUPABASE_SERVICE_ROLE_KEY || "").trim(), "TEST_SUPABASE_SERVICE_ROLE_KEY", "service_role");
            console.log("Verified primary Supabase project credentials for qbwnzunusmaidciakuod.");
          '

      - name: Primary Supabase integration tests
        env:
          TEST_SUPABASE_URL: https://qbwnzunusmaidciakuod.supabase.co
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:integration
