name: Manual Supabase RLS Integration Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-rls-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-integration:
    name: Primary Supabase RLS Integration Verification (On-Demand)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Primary Supabase integration tests
        env:
          TEST_SUPABASE_URL: https://qbwnzunusmaidciakuod.supabase.co
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:integration

