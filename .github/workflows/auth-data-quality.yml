name: Auth and app quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        with:
          node-version: 22
        run: npm install
      - name: Family data integrity tests
        run: npx tsx --test src/domain/familySpaceCore.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
