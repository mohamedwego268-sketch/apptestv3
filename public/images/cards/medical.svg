<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="medWarmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="48%" stop-color="#fdebd9"/>
      <stop offset="100%" stop-color="#d7f3ec"/>
    </linearGradient>
    <radialGradient id="medSunGlow" cx="82%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#fed7aa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#99f6e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="medBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#medWarmBg)"/>
  <rect width="800" height="500" fill="url(#medSunGlow)"/>
  <!-- Warm Sunlit Clinic Window Rays -->
  <polygon points="480,0 800,0 800,390 310,500" fill="#ffffff" opacity="0.45"/>
  <polygon points="600,0 800,0 800,250 460,500" fill="#ffedd5" opacity="0.42"/>
  <!-- Depth-of-Field Photographic Bokeh -->
  <circle cx="650" cy="120" r="95" fill="url(#medBokeh)"/>
  <circle cx="530" cy="280" r="70" fill="url(#medBokeh)"/>
  <circle cx="220" cy="145" r="60" fill="url(#medBokeh)"/>
  <circle cx="705" cy="345" r="80" fill="url(#medBokeh)"/>
  <!-- Warm Pediatric Care Silhouette -->
  <g opacity="0.52" transform="translate(465, 95)">
    <rect x="40" y="30" width="225" height="265" rx="32" fill="#ffffff" opacity="0.72"/>
    <circle cx="152" cy="125" r="56" fill="#ffedd5"/>
    <path d="M152 95 v60 M122 125 h60" stroke="#ff8c61" stroke-width="14" stroke-linecap="round"/>
    <path d="M78 225 Q118 188 158 225 T238 225" fill="none" stroke="#14b8a6" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Soft Botanical Foreground -->
  <path d="M40 500 Q65 365 155 315 Q115 415 125 500 Z" fill="#99f6e4" opacity="0.45"/>
  <path d="M95 500 Q145 385 235 355 Q180 435 170 500 Z" fill="#fed7aa" opacity="0.5"/>
</svg>
