    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#storeBg)"/>
  <rect width="800" height="500" fill="url(#warmGlow)"/>
  <!-- Sunlit Nursery Shelf & Montessori Rainbow Silhouette -->
