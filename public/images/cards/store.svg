<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="storeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="78%" cy="26%" r="58%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#115e59" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.45"/>
